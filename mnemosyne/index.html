<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mnemosyne</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151c;
    --panel-border: #232838;
    --text: #e7e9ee;
    --muted: #8a90a2;
    --accent: #7c9eff;
    --accent-dim: #3a4b8a;
    --danger: #ff6b6b;
    --ok: #4ad395;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #161a24 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 440px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  h1 {
    font-size: 1.4rem;
    margin: 0;
    letter-spacing: 0.02em;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.82rem;
    margin: 0 0 20px;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.2s ease;
  }

  .dot.connecting { background: #e0b84c; animation: pulse 1.2s infinite; }
  .dot.connected { background: var(--ok); }
  .dot.error { background: var(--danger); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .transcript {
    height: 260px;
    overflow-y: auto;
    background: #0e1017;
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 18px;
    font-size: 0.86rem;
    line-height: 1.45;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .transcript:empty::before {
    content: "Transcript will show up here once you connect.";
    color: var(--muted);
    font-style: italic;
  }

  .line { padding: 2px 0; }
  .line-system { color: var(--muted); font-size: 0.8rem; }
  .line-tool { color: var(--accent); font-size: 0.8rem; }
  .line-assistant { color: var(--text); }
  .line-error { color: var(--danger); }

  .controls {
    display: flex;
    gap: 10px;
  }

  button {
    flex: 1;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid var(--panel-border);
    background: #1a1f2b;
    color: var(--text);
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, opacity 0.15s ease;
  }

  button:hover:not(:disabled) { background: #212739; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  #connect-btn {
    background: var(--accent-dim);
    border-color: var(--accent);
  }

  #connect-btn.active {
    background: #3a1f28;
    border-color: var(--danger);
  }

  #mic-btn.muted {
    background: #2a1f1f;
    border-color: var(--danger);
    color: var(--danger);
  }

  footer {
    margin-top: 16px;
    color: var(--muted);
    font-size: 0.74rem;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <header>
      <h1>Mnemosyne</h1>
    </header>
    <p class="subtitle">Voice access to your knowledge base &mdash; English only.</p>

    <div class="status-row">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Idle</span>
    </div>

    <div class="transcript" id="transcript"></div>

    <div class="controls">
      <button id="connect-btn">Connect</button>
      <button id="mic-btn" disabled>Mute</button>
    </div>

    <footer>Requires microphone access. Speak in English.</footer>
  </div>

  <audio id="remote-audio" autoplay></audio>

  <script src="/mnemosyne/app.js"></script>
</body>
</html>
