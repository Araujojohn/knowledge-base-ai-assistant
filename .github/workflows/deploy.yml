name: Build & Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-action-ci-cd

      - name: Run tests
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          TESTS_DB_NAME: ${{ secrets.TESTS_DB_NAME }}
          TESTS_DB_USER: ${{ secrets.TESTS_DB_USER }}
          TESTS_DB_PASSWORD: ${{ secrets.TESTS_DB_PASSWORD }}
          OPENAI_API_TOKEN: ${{ secrets.OPENAI_API_TOKEN }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: python -m pytest tests/ -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-action-ci-cd

      - name: Deploy to CapRover
        env:
          CAPROVER_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
          IMAGE: "ghcr.io/araujojohn/knowledge-base-ai-assistant:${{ github.sha }}"
        run: |
          CAPTAIN_DEFINITION=$(jq -n --arg image "$IMAGE" '{schemaVersion: 2, imageName: $image} | tostring')
          BODY=$(jq -n --argjson def "$CAPTAIN_DEFINITION" --arg sha "${{ github.sha }}" '{captainDefinitionContent: $def, gitHash: $sha}')
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            "https://captain.artace.app/api/v2/user/apps/appData/knowledge-base-ai-assistant?detached=1" \
            -H "x-captain-app-token: $CAPROVER_TOKEN" \
            -H "x-namespace: captain" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')
          echo "$RESPONSE_BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Deploy request failed with HTTP $HTTP_CODE"
            exit 1
          fi
          if ! echo "$RESPONSE_BODY" | jq -e '.status == 100 or .status == 101' > /dev/null; then
            echo "CapRover did not report a successful deploy"
            exit 1
          fi




